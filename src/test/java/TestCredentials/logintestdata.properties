# production.url=https://www.target.com/
# valid.username=
# valid.password=

- name: Inject Secrets into Properties File
      run: |
        cat <<EOF >> src/test/resources/logintestdata.properties
        production.url=https://www.target.com/
        valid.username=${{ secrets.TARGET_USERNAME }}
        valid.password=${{ secrets.TARGET_PASSWORD }}
        EOF